name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # Build and Push both images
  # ===========================================================================

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # GHCR Login
      # -----------------------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Backend metadata
      # -----------------------------------------------------------------------

      - name: Extract Backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # -----------------------------------------------------------------------
      # Build Backend
      # -----------------------------------------------------------------------

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # -----------------------------------------------------------------------
      # Frontend metadata
      # -----------------------------------------------------------------------

      - name: Extract Frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # -----------------------------------------------------------------------
      # Build Frontend + Nginx
      # -----------------------------------------------------------------------

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===========================================================================
  # Deploy to VPS
  # ===========================================================================

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-and-push]

    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://vitrinsbz.ir

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1

        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}

          envs: GHCR_USERNAME,GHCR_READ_TOKEN

          script: |
            set -eu

            cd "${{ secrets.DEPLOY_PATH }}"

            git pull --ff-only origin main

            echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            docker compose --profile production pull web nginx

            docker compose --profile production up -d --no-build

            docker image prune -f
