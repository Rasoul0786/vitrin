
name: vitrin

services:
  # ===========================================================================
  # Shared services: Development + Production
  # ===========================================================================

  db:
    image: postgres:16-alpine
    container_name: vitrin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitrin}
      POSTGRES_USER: ${POSTGRES_USER:-vitrin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrin_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-vitrin} -d ${POSTGRES_DB:-vitrin}
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vitrin_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Development: Django
  # ===========================================================================

  backend-dev:
    profiles: ["development"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vitrin_backend_dev
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key}
      DEBUG: "True"
      DATABASE_URL: postgres://${POSTGRES_USER:-vitrin}:${POSTGRES_PASSWORD:-vitrin_dev}@db:5432/${POSTGRES_DB:-vitrin}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - dev_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000

  # ===========================================================================
  # Development: React + Vite
  # ===========================================================================

  frontend-dev:
    profiles: ["development"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vitrin_frontend_dev
    restart: unless-stopped
    environment:
      DOCKER_DEV: "true"
      VITE_API_PROXY_TARGET: http://backend-dev:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev
    networks:
      - net

  # ===========================================================================
  # Production: Django + Gunicorn
  # ===========================================================================

  web:
    profiles: ["production"]
    image: ghcr.io/rasoul0786/vitrin/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitrin_web
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-vitrin}:${POSTGRES_PASSWORD:-vitrin_dev}@db:5432/${POSTGRES_DB:-vitrin}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
    expose:
      - "8000"

  # ===========================================================================
  # Production: React + Nginx
  # ===========================================================================

  nginx:
    profiles: ["production"]
    image: ghcr.io/rasoul0786/vitrin/frontend:latest
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: vitrin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - net

  # ===========================================================================
  # Production: Certbot
  # ===========================================================================

  certbot:
    profiles: ["production"]
    image: certbot/certbot:latest
    container_name: vitrin_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;'
    networks:
      - net

# ===========================================================================
# Volumes
# ===========================================================================

volumes:
  postgres_data:
  redis_data:
  dev_media:
  frontend_node_modules:
  static_volume:
  media_volume:
  logs_volume:
  certbot_conf:
  certbot_www:

# ===========================================================================
# Network
# ===========================================================================

networks:
  net:
    driver: bridge
